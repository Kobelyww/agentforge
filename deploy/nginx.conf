# AgentForge reverse proxy example (SSE-safe).
# Test with: nginx -t && nginx -s reload

upstream agentforge {
    server 127.0.0.1:8000;
    keepalive 32;
}

server {
    listen 80;
    server_name forgeops.example.com;

    # --- SSE requirements: disable buffering, long read timeout ---
    location / {
        proxy_pass http://agentforge;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_buffering off;          # critical for /api/*/chat streaming
        proxy_cache off;
        proxy_read_timeout 3600s;     # long-lived chat streams (+ HITL approval waits)
        proxy_send_timeout 3600s;

        client_max_body_size 10m;     # knowledge-base uploads (5 MB limit + headroom)
    }

    # hashed SPA assets are immutable — cache hard
    location /assets/ {
        proxy_pass http://agentforge;
        proxy_cache_valid 200 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
    }
}

