# ForgeOps 设备诊断评测集
# 运行: agentforge eval examples/suites/forgeops.yaml
# 说明: 验证 Agent 在行业任务上的工具编排正确性与结论质量。
#       CI 中作为回归门禁 —— 工具命中率或结论断言回归时流水线失败。

cases:
  - name: sandbox_arithmetic
    description: 数学计算应触发 python_repl 沙箱并返回正确结果
    input: 帮我计算 128*365+42
    expect_tools: [python_repl]
    expect_contains: ["46762"]

  - name: diagnosis_multi_agent_full_chain
    description: 设备诊断应走规划-多智能体并行-汇总-审核全链路（子代理扇出+工单）
    input: 诊断 AC-017 空压机昨晚异响振动报警，给出结论并生成维修工单
    orchestrator: plan_execute
    max_iterations: 8
    expect_tools: [rag_search, dispatch_subagent, create_work_order]
    expect_contains: ["轴承外圈磨损", "0.87"]

  - name: knowledge_lookup_react
    description: 知识查询应触发 rag_search 检索设备手册
    input: 检索一下手册里关于轴承更换 SOP 的内容
    expect_tools: [rag_search]
    expect_contains: ["工具执行完成"]

  - name: sensor_analysis_direct
    description: 让 Agent 直接分析 AC-017 的振动频谱并给出状态判定
    input: 分析 AC-017 的振动数据，频谱峰值是多少，当前 ISO 10816 状态如何
    expect_tools: [sensor_analysis]
    # FFT 分辨率为 1 Hz（1s 采样），BPFO 176.85 Hz 落在 177 Hz bin
    expect_contains: ["177", "alarm"]
